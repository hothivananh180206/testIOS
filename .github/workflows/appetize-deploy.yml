name: Build iOS Simulator ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build .app and create ZIP
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project AppHocTiengNhat.xcodeproj \
            -scheme AppHocTiengNhat \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Zip .app
        run: |
          cd DerivedData/Build/Products/Release-iphonesimulator
          zip -r AppHocTiengNhat.zip AppHocTiengNhat.app

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppHocTiengNhat-iOS-Simulator
          path: DerivedData/Build/Products/Release-iphonesimulator/AppHocTiengNhat.zip
          retention-days: 7
