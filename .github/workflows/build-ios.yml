name: Build & Deploy iOS App to Appetize

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to Appetize.io
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project AppHocTiengNhat.xcodeproj \
            -scheme AppHocTiengNhat \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create .zip for Appetize.io
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r AppHocTiengNhat.zip AppHocTiengNhat.app
          ls -lh AppHocTiengNhat.zip

      - name: Upload Built App Artifact (Downloadable Zip)
        uses: actions/upload-artifact@v4
        with:
          name: AppHocTiengNhat-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/AppHocTiengNhat.zip
          retention-days: 7

      - name: Upload Directly to Appetize.io
        if: ${{ env.APPETIZE_API_TOKEN != '' }}
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          platform: 'ios'
          appFile: 'build/Build/Products/Debug-iphonesimulator/AppHocTiengNhat.zip'
          note: 'Build commit ${{ github.sha }}'
